name: manutencao_app
description: App de chamados de manutencao com triagem e relatorios por IA - Projeto Integrado UNIFEOB
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend em nuvem (banco de dados em tempo real)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Gerenciamento de estado
  provider: ^6.1.2

  # Requisicoes HTTP (usado para chamar a API de IA do Google Gemini)
  http: ^1.2.2

  # Armazenamento local simples (guarda quem esta logado no aparelho)
  shared_preferences: ^2.3.2

  # Formatacao de datas em portugues
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
